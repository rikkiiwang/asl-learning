# Recognizer A — geometry-only (the anti-overfitting thesis test, Plan 4 Task 5)
variant:   a
cache:     artifacts/cache/constellation_clips.npz
n_classes: 75

# Model
emb:       192
head:      attn        # attn | transformer
dropout:   0.3

# Optimisation
lr:                2.0e-3
weight_decay:      0.05
epochs:            80
batch_size:        64
warmup_epochs:     3
label_smoothing:   0.1
early_stop_patience: 15
kp_jitter:         0.01
seed:              1337
num_workers:       0

out_dir:   artifacts/checkpoints/recog_a
