# Recognizer A — geometry-only (the anti-overfitting thesis test, Plan 4 Task 5)
variant:   a
cache:     artifacts/cache/constellation_clips.npz
n_classes: 75

# Model
emb:          192
head:         transformer   # attn | transformer  (transformer models sign dynamics)
dropout:      0.3
use_velocity: true          # per-frame Δgeometry (motion) — signs are defined by motion
strong_aug:   true          # temporal warp + pose rot/scale + frame dropout (thin-data regularizer)

# Optimisation
lr:                2.0e-3
weight_decay:      0.05
epochs:            80
batch_size:        64
warmup_epochs:     3
label_smoothing:   0.1
early_stop_patience: 15
kp_jitter:         0.01
seed:              1337
num_workers:       0

out_dir:   artifacts/checkpoints/recog_a

# WLASL cross-dataset added to TRAIN only (val/test stay ASL Citizen signer-held-out)
extra_cache:  artifacts/cache/wlasl_clips.npz
