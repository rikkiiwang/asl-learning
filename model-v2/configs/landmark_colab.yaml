# Landmark training configuration — Colab variant (shrunk dataset, max_side=128)
# Uses pre-shrunk images (max_side=128) for fast upload.
# data_root is passed via --data-root /content/data/landmark_small in the notebook.

data_root:        data/landmark_small
train_manifest:   artifacts/landmark/train_small.json
val_manifest:     artifacts/landmark/val_small.json

# Normalisation (ImageNet RGB — consistent with detector pipeline)
norm:
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

# Model — must match KpDataset crop size (unchanged from full-res)
img:    64
width:  64

# Optimisation
lr:                  3.0e-3
weight_decay:        0.02
epochs:              80
batch_size:          128
warmup_epochs:       3
early_stop_patience: 15
seed:                1337

# DataLoader workers (T4 Colab recommends <=2 to avoid "suggested 2" warning)
num_workers: 2

# Output
out_dir: artifacts/checkpoints/landmark
