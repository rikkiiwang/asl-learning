# RGB + optical-flow late fusion, ROI clips.
cache: artifacts/cache/clips_roi_flow.npz
norm: artifacts/manifest/norm_roi.json
flow_norm: artifacts/manifest/norm_roi_flow.json
manifest: artifacts/manifest/manifest.json

two_stream: true
pretrained_encoder: artifacts/checkpoints/pretrain/encoder.pt

head: attn
emb: 384
width: 48
dropout: 0.3
tf_layers: 1
tf_heads: 4

epochs: 60
batch_size: 32
lr: 0.0015
weight_decay: 0.05
warmup_epochs: 3
label_smoothing: 0.1
early_stop_patience: 12
seed: 1337

out_dir: artifacts/checkpoints/finetune_twostream
